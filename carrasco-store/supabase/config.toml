# Fragmento de referencia para la configuracion de Auth > Emails de Supabase.
# El proyecto SI esta enlazado (`supabase link --project-ref vygocxhtbghtwewyrymq`,
# 02/10/2026), pero este archivo sigue siendo parcial a proposito: no tiene las
# secciones [api]/[db]/[storage]/etc. que un config.toml completo tendria. NO
# correr `supabase config push` con este archivo tal cual: ese comando
# reemplaza toda la configuracion de Auth del proyecto, y podria resetear a
# default ajustes que hoy existen en el Dashboard pero no estan aca (MFA,
# notificaciones, SMS, proveedores, etc.).
#
# Para aplicar un cambio en [auth.email.template.*] o [auth.rate_limit] al
# proyecto real:
#
#   a) Preferido: un PATCH acotado a la Management API
#      (PATCH https://api.supabase.com/v1/projects/<ref>/config/auth) con
#      SOLO los campos que cambiaron (ej. mailer_templates_confirmation_content,
#      mailer_subjects_recovery) — asi nunca se tocan campos que no vienen al caso.
#   b) O, mas simple para un cambio puntual, copiar el valor a mano en el
#      Dashboard: Authentication > Emails (plantillas + asuntos) y
#      Authentication > Rate Limits (email_sent).
#
# Los .html referenciados abajo viven en ./supabase/templates/.

[auth.email]
enable_signup = true
enable_confirmations = true   # obliga a confirmar el correo antes de dejar loguear
max_frequency = "1m0s"        # minutos entre reenvios del mismo tipo de correo

[auth.email.template.confirmation]
subject = "Confirma tu correo electrónico · Carrasco Store"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Restablece tu contraseña · Carrasco Store"
content_path = "./supabase/templates/recovery.html"

[auth.rate_limit]
email_sent = 2   # correos/hora — subir esto en produccion real

# Opcional pero recomendado para produccion real: el SMTP por defecto de
# Supabase esta pensado para pruebas (2 correos/hora). Con un proveedor propio
# (Resend, SendGrid, etc.) ese limite no aplica.
# [auth.email.smtp]
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(RESEND_SMTP_PASSWORD)"
# sender_name = "Carrasco Store"
